<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shoganai — Game Portfolio</title>
	<meta name="description" content="An interactive game-like portfolio. Talk to NPCs, defeat enemies, collect artworks and explore Shoganai's world." />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<nav class="game-navbar" aria-label="Main navigation">
		<div class="game-nav-inner">
			<a class="game-brand" href="../web/index.html" aria-label="Go back to home"></a>
		</div>
	</nav>

	<!-- HUD -->
	<div id="hud">
		<div id="hud-hearts" aria-label="Health"></div>
		<div id="hud-gems" aria-label="Unlocked artworks"></div>
		<div id="hud-orbs" aria-label="Orbs"></div>
		<button id="artwork-open" type="button">ART</button>
		<div id="hint" class="hidden"></div>
	</div>

	<div id="artwork-gallery" class="hidden" aria-hidden="true">
		<div class="artwork-panel">
			<button id="artwork-close" type="button" aria-label="Close artwork gallery">X</button>
			<h2>Unlocked Artworks <span id="artwork-count"></span></h2>
			<div id="artwork-grid"></div>
			<p>Press G to close</p>
		</div>
	</div>

	<div id="game-wrap">
		<canvas id="myCanvas" width="640" height="360"></canvas>

		<!-- Dialogue -->
		<div id="dialogue-box" class="hidden">
			<div id="dialogue-name"></div>
			<p id="dialogue-text"></p>
			<span id="dialogue-next"></span>
		</div>

		<!-- Pause / menu -->
		<div id="pause-overlay" class="hidden">
			<h1 class="pause-title">Paused</h1>
			<ul class="controls">
				<li><span>WASD / Arrows</span> move</li>
				<li><span>E</span> interact</li>
				<li><span>SPACE</span> attack</li>
				<li><span>ESC</span> pause</li>
			</ul>
			<div class="pause-actions">
				<button id="btn-resume" class="pixel-btn">Resume</button>
				<a id="btn-switch-web" class="pixel-btn" href="../web/index.html">Switch to Web</a>
				<button id="btn-restart" class="pixel-btn" onclick="window.location.reload()">Restart</button>
			</div>
			<p class="pause-note">
				Your quest: collect five artworks and visit the Tower of Creation to open this portfolio's website.
			</p>
		</div>
	</div>

	<div id="mobile-controls" aria-label="Touch controls">
		<div id="touch-joystick" aria-label="Move">
			<div id="touch-knob"></div>
		</div>
		<div class="mobile-actions">
			<button id="touch-interact" type="button">E</button>
			<button id="touch-shoot" type="button">ORB</button>
		</div>
	</div>

	<script src="js/config.js"></script>
	<script src="js/input.js"></script>
	<script src="js/helper.js"></script>
	<script src="js/camera.js"></script>
	<script src="js/placeholder.js"></script>
	<script src="js/data/dialogues.js"></script>
	<script src="js/systems/dialogue.js"></script>
	<script src="js/systems/hud.js"></script>
	<script src="js/entities/entity.js"></script>
	<script src="js/entities/interactable.js"></script>
	<script src="js/entities/tree.js"></script>
	<script src="js/entities/gem.js"></script>
	<script src="js/entities/npc.js"></script>
	<script src="js/entities/enemy.js"></script>
	<script src="js/entities/projectile.js"></script>
	<script src="js/entities/player.js"></script>
	<script src="js/scene.js"></script>
	<script src="js/main.js"></script>
</body>
</html>

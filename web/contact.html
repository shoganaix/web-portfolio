	<script src="https://kit.fontawesome.com/31149d48b0.js" crossorigin="anonymous"></script>
</head>
<body>
	<!-- (navbar) Menu arriba -->
	<nav class="navbar navbar-expand-lg fixed-top navbar-dark navbarScroll">
		<div class="container">
			<a class="navbar-brand" href="../game/index.html" aria-label="Switch to the game experience"></a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto">

						<a class="nav-link" href="index.html">Home</a>

					</li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- Contact page -->
	<section class="contactbgimage" id="contact">
		<h1 class="contactext">Send me a message!</h1>
		<div class="container2 col-lg-6 col-md-8 col-sm-10">
			<form action="https://formspree.io/f/xzbndvwd" method="POST">
				<label for="name"></label>
				<input type="text" name="name" id="name" class="form-control mt-3 name" placeholder="Name" required>
				<label for="email"></label>
				<input type="email" name="email" id="email" class="form-control mt-3 email" placeholder="Email" required>
				<label for="subject"></label>
				<input type="text" name="subject" id="subject" class="form-control mt-3 subject" placeholder="Subject">
				<div class="mb-3 mt-3 message">
					<label for="message"></label>
					<textarea class="form-control" rows="5" name="message" id="message" placeholder="Message" required></textarea>
				</div>
				<button type="submit" name="submit" class="btn btn-success mt-3 btn-send" value="Send">Send</button>
			</form>
		</div>
	</section>

	<!-- footer section-->
	<footer id="footer">
		<div class="container-fluid">
			<!-- social media icons -->
			<div class="social-icons mt-2">
				<a href="https://www.artstation.com/shoganai" target="_blank" aria-label="ArtStation"><i class="fab fa-artstation"></i></a>
				<a href="https://www.instagram.com/lashoganai/?hl=es" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
				<a href="https://github.com/shoganaix" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
				<a href="https://es.linkedin.com/in/maria-soriano-palacios" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
			</div>
		</div>
	</footer>
</body>
</html>
